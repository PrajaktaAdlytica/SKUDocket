<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Conditional landed-cost scenario comparison</title><desc id="desc">Synthetic concept example; no live product data.</desc><style>text{font-family:Public Sans,Arial,sans-serif;fill:#263C4C}.serif{font-family:Source Serif 4,Georgia,serif}.small{font-size:12px;fill:#5B6870}</style><rect x="0" y="0" width="720" height="420" rx="0" fill="#FAF7EF" stroke="#FAF7EF"/><text x="28" y="32" font-size="10" style="fill:#5B6870" font-weight="600" class="">DEMO — SYNTHETIC DATA</text><text x="28" y="70" font-size="25" style="fill:#263C4C" font-weight="600" class="serif">Two scenarios, with included costs in view.</text><text x="28" y="94" font-size="12" style="fill:#5B6870" font-weight="400" class="">HX-42 · Alder Import Co · Harborside Works</text><path d="M28 110L692 110" fill="none" stroke="#D5D2CA" stroke-width="1"/><rect x="64" y="159.13214285714287" width="115" height="156.86785714285713" rx="0" fill="#263C4C" stroke="#263C4C"/><text x="199" y="205" font-size="14" style="fill:#263C4C" font-weight="600" class="">Scenario A</text><text x="199" y="231" font-size="21" style="fill:#263C4C" font-weight="600" class="serif">$13,310</text><text x="199" y="257" font-size="12" style="fill:#5B6870" font-weight="400" class="">1,000 units</text><text x="199" y="281" font-size="12" style="fill:#263C4C" font-weight="400" class="">$13.31 / unit</text><rect x="359" y="156.30357142857142" width="115" height="159.69642857142858" rx="0" fill="#98443F" stroke="#98443F"/><text x="494" y="205" font-size="14" style="fill:#263C4C" font-weight="600" class="">Scenario B</text><text x="494" y="231" font-size="21" style="fill:#263C4C" font-weight="600" class="serif">$13,550</text><text x="494" y="257" font-size="12" style="fill:#5B6870" font-weight="400" class="">1,000 units</text><text x="494" y="281" font-size="12" style="fill:#263C4C" font-weight="400" class="">$13.55 / unit</text><path d="M52 318L676 318" fill="none" stroke="#D5D2CA" stroke-width="1"/><text x="28" y="349" font-size="13" style="fill:#263C4C" font-weight="400" class="">Difference: $240 · Scenario difference, not savings</text><text x="28" y="374" font-size="12" style="fill:#5B6870" font-weight="400" class="">Excluded charges and valuation adjustments require review.</text><text x="28" y="400" font-size="11" style="fill:#5B6870" font-weight="400" class="">Illustrative scenario · Invented 4% / 6% rates · Not a duty quote</text></svg>