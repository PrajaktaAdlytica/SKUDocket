<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Three-step reviewed evidence workflow</title><desc id="desc">Synthetic concept example; no live product data.</desc><style>text{font-family:Public Sans,Arial,sans-serif;fill:#263C4C}.serif{font-family:Source Serif 4,Georgia,serif}.small{font-size:12px;fill:#5B6870}</style><rect x="0" y="0" width="720" height="420" rx="0" fill="#FAF7EF" stroke="#FAF7EF"/><text x="28" y="32" font-size="10" style="fill:#5B6870" font-weight="600" class="">DEMO — SYNTHETIC DATA</text><text x="28" y="70" font-size="25" style="fill:#263C4C" font-weight="600" class="serif">Collect. Review. Assemble.</text><text x="28" y="94" font-size="12" style="fill:#5B6870" font-weight="400" class="">HX-42 · Alder Import Co · Harborside Works</text><path d="M28 110L692 110" fill="none" stroke="#D5D2CA" stroke-width="1"/><rect x="28" y="150" width="211" height="160" rx="6" fill="#F0E4BA" stroke="#D5D2CA"/><text x="43" y="184" font-size="27" style="fill:#AF5A56" font-weight="600" class="serif">01</text><text x="43" y="225" font-size="17" style="fill:#263C4C" font-weight="600" class="">Collect evidence</text><text x="43" y="255" font-size="12" style="fill:#5B6870" font-weight="400" class="">Facts and source versions</text><rect x="254" y="150" width="211" height="160" rx="6" fill="#E7EFF5" stroke="#D5D2CA"/><text x="269" y="184" font-size="27" style="fill:#AF5A56" font-weight="600" class="serif">02</text><text x="269" y="225" font-size="17" style="fill:#263C4C" font-weight="600" class="">Review exceptions</text><text x="269" y="255" font-size="12" style="fill:#5B6870" font-weight="400" class="">Alternatives and holds</text><rect x="480" y="150" width="211" height="160" rx="6" fill="#D6E1D5" stroke="#D5D2CA"/><text x="495" y="184" font-size="27" style="fill:#AF5A56" font-weight="600" class="serif">03</text><text x="495" y="225" font-size="17" style="fill:#263C4C" font-weight="600" class="">Assemble packet</text><text x="495" y="255" font-size="12" style="fill:#5B6870" font-weight="400" class="">Broker questions included</text><text x="28" y="350" font-size="14" style="fill:#263C4C" font-weight="400" class="">A human decision belongs between evidence and packet review.</text><text x="28" y="400" font-size="11" style="fill:#5B6870" font-weight="400" class="">Demo data as of 01 Oct 2026 · Source-linked · No filing</text></svg>